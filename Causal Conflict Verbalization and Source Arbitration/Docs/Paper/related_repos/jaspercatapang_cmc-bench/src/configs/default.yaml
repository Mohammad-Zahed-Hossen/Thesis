# CMC-Bench default config
# Local inference via mlx-vlm (Apple Silicon); models loaded 4-bit per entries below.

paths:
  data_dir: "./data_cache"
  output_dir: "./outputs"
  instances_jsonl: "./outputs/cmc_bench_instances.jsonl"
  predictions_dir: "./outputs/predictions"

datasets:
  chartqa: "HuggingFaceM4/ChartQA"
  mmmu: "MMMU/MMMU"
  # MMMU subsets: diverse domains for entity + granularity (STEM, humanities, social, applied)
  mmmu_configs:
    - Physics
    - History
    - Psychology
    - Computer_Science
    - Art
    - Economics

scale:
  factual_chartqa: 250
  temporal_chartqa: 250
  entity_mmmu: 250
  granularity_mmmu: 250

models:
  qwen3-vl-4b:
    mlx_id: "mlx-community/Qwen3-VL-4B-Instruct-4bit"
  lfm2.5-vl-1.6b:
    mlx_id: "mlx-community/LFM2.5-VL-1.6B-4bit"
  gemma-3n-e2b:
    mlx_id: "mlx-community/gemma-3n-E2B-it-4bit"
  deepseek-vl2-small:
    mlx_id: "mlx-community/deepseek-vl2-small-4bit"
